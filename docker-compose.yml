version: "3.8"

# MoodleBot dev environment
# Run: docker compose up -d
# Moodle will be available at http://localhost:8080
# First boot takes a few minutes while Moodle installs itself.

services:
  moodle-db:
    image: bitnamilegacy/mariadb:10.11
    container_name: moodlebot-db
    restart: unless-stopped
    environment:
      MARIADB_USER: moodle
      MARIADB_PASSWORD: moodle_pass
      MARIADB_DATABASE: moodle
      MARIADB_ROOT_PASSWORD: root_pass
    volumes:
      - moodle_db_data:/bitnami/mariadb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  moodle:
    image: bitnamilegacy/moodle:4.4
    container_name: moodlebot-lms
    restart: unless-stopped
    depends_on:
      moodle-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: moodle-db
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_PASSWORD: moodle_pass
      MOODLE_DATABASE_NAME: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: ChangeMe123!
      MOODLE_EMAIL: admin@moodlebot.local
      MOODLE_SITE_NAME: "MoodleBot Pilot Course Site"
      BITNAMI_DEBUG: "true"
    volumes:
      - moodle_data:/bitnami/moodle
      - moodle_data_moodledata:/bitnami/moodledata
      - ./moodle-plugin/block_moodlebot:/bitnami/moodle/blocks/moodlebot

volumes:
  moodle_db_data:
  moodle_data:
  moodle_data_moodledata:
